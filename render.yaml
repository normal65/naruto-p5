services:
  - type: web
    name: naruto-p5
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: naruto-db
          property: connectionString

databases:
  - name: naruto-db
    plan: free
    databaseName: game
